# Puck game server VM: 1 GiB RAM, 2 CPUs (1 CPU x 2 threads), Ubuntu 24.04 LTS.
# Usage (Windows host, from repo root):
#   limactl start ./vm/puck.yaml
#   limactl shell puck
# Host access: game at 127.0.0.1:25565 (TCP+UDP), 7777-7778/UDP; SSH via `limactl shell puck`.
# ponytail: containerd off + no mounts; this box only runs the Puck server.
vmType: qemu
arch: x86_64
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
cpus: 2
memory: "1GiB"
disk: "40GiB"
mounts: []
containerd:
  system: false
  user: false
portForwards:
  - guestPort: 25565
    hostPort: 25565
    proto: tcp
  - guestPort: 25565
    hostPort: 25565
    proto: udp
  - guestPort: 7777
    hostPort: 7777
    proto: udp
  - guestPort: 7778
    hostPort: 7778
    proto: udp
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      # 1 GiB RAM needs swap or the Unity player OOMs under load.
      if ! swapon --show | grep -q /swapfile; then
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
        sysctl -w vm.swappiness=10
        echo 'vm.swappiness=10' > /etc/sysctl.d/99-puck.conf
      fi
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl net-tools ufw
      ufw allow 22/tcp
      ufw allow 25565/tcp
      ufw allow 25565/udp
      ufw allow 7777/udp
      ufw allow 7778/udp
      ufw --force enable
      cat > /etc/systemd/system/puck@.service <<'UNIT'
      [Unit]
      Description=Puck dedicated server
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=simple
      User=%i
      # Profiler steady state: Harmony instruments the proven-safe set; the 3
      # Harmony-breaking types (Snapshot/Data/TickHeader) use in-method SyncPerf
      # timing to its own file instead. See AGENTS.md.
      Environment=PUCK_PROFILE=1
      Environment=PUCK_SYNC_PROFILE=1
      Environment="PUCK_PROFILE_SKIP=SynchronizedObjectClientDiagnostics;SynchronizedObjectClientReceiver;SynchronizedObjectController;SynchronizedObjectData;SynchronizedObjectDriveCadence;SynchronizedObjectInterpolator;SynchronizedObjectLodCounts;SynchronizedObjectLodSelection;SynchronizedObjectLodSource;SynchronizedObjectManagerController;SynchronizedObjectNetworkSmoothingSettings;SynchronizedObjectPlayback;SynchronizedObjectPlayerDiagnosticsData;SynchronizedObjectPose;SynchronizedObjectSample;SynchronizedObjectSendState;SynchronizedObjectServerDiagnostics;SynchronizedObjectSmoothing;SynchronizedObjectSnapshot;SynchronizedObjectTickHeader;SynchronizedObjectTimeline;SynchronizedObjectReceivedState;SynchronizedObjectBandSettings"
      ExecStart=/bin/bash -c 'cd "$HOME/puck-server/server" && export LD_LIBRARY_PATH="$PWD:$LD_LIBRARY_PATH" && exec ./Puck -batchmode -nographics'
      Restart=on-failure
      RestartSec=5
      TimeoutStopSec=10
      KillSignal=SIGKILL
      [Install]
      WantedBy=multi-user.target
      UNIT
      systemctl daemon-reload
