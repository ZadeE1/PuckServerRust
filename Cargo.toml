[package]
name = "puck-server-rust"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust prototype remake of Puck (NS7) dedicated server: fixed-timestep hockey physics + UDP snapshots"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
